name: Build Robot AI Private V6.8 Anywhere

on:
  workflow_dispatch:
    inputs:
      private_server_ip:
        description: "IPv4 LAN cố định của Mac mini"
        required: true
        type: string
      anywhere_ota_url:
        description: "Optional override. Prefer repo secret V68_ANYWHERE_OTA_URL to avoid logging the secret path."
        required: false
        default: ""
        type: string
      version:
        description: "Phiên bản firmware"
        required: true
        default: "6.8.0"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2

    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        shell: bash
        env:
          ANYWHERE_OTA_URL_SECRET: ${{ secrets.V68_ANYWHERE_OTA_URL }}
          ANYWHERE_OTA_URL_INPUT: ${{ inputs.anywhere_ota_url }}
        run: |
          IP="${{ inputs.private_server_ip }}"
          VER="${{ inputs.version }}"
          ANY="$ANYWHERE_OTA_URL_INPUT"
          if [ -z "$ANY" ]; then
            ANY="$ANYWHERE_OTA_URL_SECRET"
          fi
          echo "::add-mask::$ANY"
          echo "$IP" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$' || exit 1
          echo "$VER" | grep -Eq '^[0-9][0-9A-Za-z._-]*$' || exit 1
          echo "$ANY" | grep -Eq '^https://[A-Za-z0-9.-]+/r/[A-Za-z0-9_-]{32,96}/xiaozhi/ota/$' || exit 1
          echo "PRIVATE_OTA_URL=http://$IP:8003/xiaozhi/ota/" >> "$GITHUB_ENV"
          echo "ANYWHERE_OTA_URL=$ANY" >> "$GITHUB_ENV"
          echo "FW_VERSION=$VER" >> "$GITHUB_ENV"

      - name: Lock private OTA URL
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("xiaozhi_overlay/main/boards/robot-ai-private-v1/config.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          sdk=d["builds"][0].setdefault("sdkconfig_append",[])
          sdk=[x for x in sdk if not x.startswith("CONFIG_OTA_URL=")]
          sdk.append(f'CONFIG_OTA_URL="{os.environ["PRIVATE_OTA_URL"]}"')
          d["builds"][0]["sdkconfig_append"]=sdk
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Inject V6.8 Anywhere OTA URL
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path("xiaozhi_overlay/main/boards/robot-ai-private-v1/config.h")
          s=p.read_text(encoding="utf-8")
          url=os.environ["ANYWHERE_OTA_URL"]
          line=f'#define ROBOT_ANYWHERE_OTA_URL "{url}"\n'
          anchor='#define ROBOT_PUBLIC_XIAOZHI_OTA_URL "https://api.tenclass.net/xiaozhi/ota/"\n'
          if anchor not in s:
              raise SystemExit("Không thấy ROBOT_PUBLIC_XIAOZHI_OTA_URL")
          s=s.replace(anchor,anchor+line,1)
          p.write_text(s,encoding="utf-8")
          PY

      - name: Checkout latest stable XiaoZhi
        uses: actions/checkout@v4
        with:
          repository: 78/xiaozhi-esp32
          ref: v2.4.2
          path: xiaozhi


      - name: Set real firmware version
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path

          p = Path("xiaozhi/CMakeLists.txt")
          s = p.read_text(encoding="utf-8")
          new, n = re.subn(
              r'set\s*\(\s*PROJECT_VER\s+"[^"]+"\s*\)',
              f'set(PROJECT_VER "{os.environ["FW_VERSION"]}")',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit("Không tìm thấy PROJECT_VER trong xiaozhi/CMakeLists.txt")
          p.write_text(new, encoding="utf-8")
          print("PROJECT_VER =", os.environ["FW_VERSION"])
          PY

      - name: Install V5 board and parity UX patches
        run: |
          python tools/install_into_xiaozhi.py "$GITHUB_WORKSPACE/xiaozhi"
          grep -q 'config.ssid_prefix = "TieuDe"' xiaozhi/main/boards/common/wifi_board.cc

      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd xiaozhi
          python scripts/build.py robot-ai-private-v1 \
            --name robot-ai-private-v1 \
            --language vi-VN \
            --wake-word disabled \
            --build-options-json '{"wifi_provisioning":"hotspot"}'
          test -f build/merged-binary.bin
          test -f build/xiaozhi.bin

      - name: Verify V5 feature markers
        shell: bash
        run: |
          BIN=xiaozhi/build/merged-binary.bin
          grep -a -q "ROBOT_PRIVATE_V6_DUAL_BRAIN_20260828" "$BIN"
          grep -a -q "self.robot.motion" "$BIN"
          grep -a -q "self.robot.dance" "$BIN"
          grep -a -q "self.robot.server_profile" "$BIN"
          grep -a -q "$ANYWHERE_OTA_URL" "$BIN"
          grep -a -q "api.tenclass.net/xiaozhi/ota/" "$BIN"
          grep -a -q "self.robot.settings" "$BIN"
          grep -a -q "self.robot.distance" "$BIN"
          grep -a -q "self.mac.command" "$BIN"
          grep -a -q "TieuDe" "$BIN"
          grep -a -q "ST7789-1.3-240x240" "$BIN"
          grep -a -q "VL6180X" "$BIN"
          grep -a -q "$PRIVATE_OTA_URL" "$BIN"
          grep -q 'CONFIG_USE_HOTSPOT_WIFI_PROVISIONING=y' xiaozhi/sdkconfig
          grep -q "CONFIG_OTA_URL=\"$PRIVATE_OTA_URL\"" xiaozhi/sdkconfig

          python - <<'PY'
          import os
          from pathlib import Path

          b = Path("xiaozhi/build/xiaozhi.bin").read_bytes()
          # ESP image header 24B + first segment header 8B; esp_app_desc_t follows.
          base = 24 + 8
          magic = int.from_bytes(b[base:base+4], "little")
          if magic != 0xABCD5432:
              raise SystemExit(f"esp_app_desc magic sai: 0x{magic:08x}")
          version = b[base+16:base+48].split(b"\0", 1)[0].decode("ascii")
          if version != os.environ["FW_VERSION"]:
              raise SystemExit(
                  f"Firmware version sai: app={version}, expected={os.environ['FW_VERSION']}"
              )
          print("Firmware app version PASS:", version)
          PY

          echo "Robot AI Private V6 verification PASS"

      - name: Collect USB OTA and browser-flash artifacts
        shell: bash
        run: |
          mkdir -p out/web_flash
          cp xiaozhi/build/merged-binary.bin out/Robot_AI_Private_V6_8_merged.bin
          cp xiaozhi/build/xiaozhi.bin out/xiaozhi.bin
          cp xiaozhi/build/xiaozhi.bin "out/robot-ai-private-v1_${FW_VERSION}.bin"
          cp xiaozhi/build/flasher_args.json out/ 2>/dev/null || true
          printf '%s\n' "$PRIVATE_OTA_URL" > out/PRIVATE_OTA_URL.txt

          cp web_flash/index.html out/web_flash/index.html
          cp web_flash/START_WEB_FLASH_MAC.command out/web_flash/START_WEB_FLASH_MAC.command
          cp xiaozhi/build/merged-binary.bin out/web_flash/firmware.bin
          python - <<'PY'
          import json,os
          p={
            "name":"Robot AI Private V6.8 Anywhere",
            "version":os.environ["FW_VERSION"],
            "new_install_prompt_erase":True,
            "builds":[{"chipFamily":"ESP32-S3","parts":[{"path":"firmware.bin","offset":0}]}]
          }
          open("out/web_flash/manifest.json","w").write(json.dumps(p,ensure_ascii=False,indent=2))
          PY
          sha256sum out/*.bin > out/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Robot_AI_Private_V6_8_Firmware
          path: out/
