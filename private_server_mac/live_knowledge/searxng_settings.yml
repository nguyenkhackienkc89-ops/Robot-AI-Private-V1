use_default_settings: true

general:
  instance_name: "RobotAI Private Search"

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "robot-ai-private-runtime-placeholder"
  limiter: false
  image_proxy: false

outgoing:
  request_timeout: 3.0
  max_request_timeout: 6.0
